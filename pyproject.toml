[project]
name = "splendid-ops-agent"
version = "0.1.0"
description = "Internal conversational ops agent for Splendid Moving"
requires-python = ">=3.12,<3.13"

dependencies = [
    # LangChain 1.0 LTS — do not drop to 0.3, it is maintenance-only
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.3.0",

    # Model backends. OpenAI for testing, OpenRouter is the destination.
    "langchain-openai>=1.0,<2.0",

    # Google Calendar
    "google-api-python-client>=2.100",
    "google-auth>=2.23",

    "requests>=2.31",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.55",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "services", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Model-calling tests are opt-in: `pytest -m live`
addopts = "-m 'not live'"
markers = [
    "live: hits a real model or API (costs money, needs network)",
]
